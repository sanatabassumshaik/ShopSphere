<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopSphere - A modern, responsive e-commerce product catalog."
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        ShopSphere | E-Commerce Product Catalog
    </title>

    <!-- Preconnect for faster font/resource connections -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="site-header">

        <div class="container header-container">

            <a
                href="#/"
                class="logo"
                aria-label="ShopSphere home"
            >
                🛍️ ShopSphere
            </a>


            <button
                type="button"
                id="menu-toggle"
                class="menu-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="nav-links"
            >
                ☰
            </button>


            <nav
                id="nav-links"
                class="nav-links"
                aria-label="Main navigation"
            >

                <a href="#/">
                    Home
                </a>

                <a href="#/products">
                    Products
                </a>

                <a href="#/about">
                    About
                </a>

                <a
                    href="#/cart"
                    class="cart-link"
                >
                    🛒 Cart
                    <span
                        id="cart-count"
                        class="cart-count"
                        aria-label="Items in cart"
                    >
                        0
                    </span>
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================
         MAIN APPLICATION
    ====================================== -->

    <main
        id="app"
        class="app"
    >

        <section class="hero">

            <div class="container hero-content">

                <div class="hero-text">

                    <p class="eyebrow">
                        Welcome to ShopSphere
                    </p>

                    <h1>
                        Shop smarter.
                        Live better.
                    </h1>

                    <p>
                        Discover quality products across
                        electronics, fashion, home and
                        lifestyle.
                    </p>

                    <a
                        href="#/products"
                        class="primary-button"
                    >
                        Explore Products
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="site-footer">

        <div class="container footer-content">

            <p>
                © 2026 ShopSphere.
                All rights reserved.
            </p>

            <p>
                Built with HTML, CSS and JavaScript.
            </p>

        </div>

    </footer>


    <!-- =====================================
         JAVASCRIPT MODULES
    ====================================== -->

    <script
        src="js/products.js"
        defer
    ></script>

    <script
        src="js/cart.js"
        defer
    ></script>

    <script
        src="js/app.js"
        defer
    ></script>

    <script
        src="js/router.js"
        defer
    ></script>

    <script
        src="js/performance.js"
        defer
    ></script>

</body>

</html>
